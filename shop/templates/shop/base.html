<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>{% block title %}Магазин мягкой мебели{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Каталог</a> |
        <a href="{% url 'cart' %}">Корзина: {{ cart_count }} шт. на {{ cart_total }} ₽</a>
    </nav>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
